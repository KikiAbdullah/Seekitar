<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 470" width="1300" height="470"
     font-family="'Plus Jakarta Sans', Inter, system-ui, sans-serif">
  <title>Seekitar — Diagram Konstruksi &amp; Grid Logo</title>
  <desc>
    Diagram spesifikasi teknis konstruksi logo Seekitar berdasarkan satuan
    x = 1/10 tinggi logomark. Logomark 8x lebar / 10x tinggi, jarak ke wordmark 3x,
    tinggi wordmark 6x, clear space 4x. CATATAN: ini diagram ukuran, bukan artwork
    logo final — bentuk pin dan kaca pembesar digambar skematis.
  </desc>

  <defs>
    <!-- 1 kotak grid = 1x = 20px pada skala diagram ini -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 L0 0 0 20" fill="none" stroke="#E5E7EB" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,1.5 L7,4.5 L0,7.5 z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="1300" height="470" fill="#FFFFFF"/>

  <!-- ============ Batas clear space (4x di seluruh sisi) ============ -->
  <rect x="100" y="40" width="1080" height="360" fill="url(#grid)"/>
  <rect x="100" y="40" width="1080" height="360" fill="none"
        stroke="#F5B83D" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="100" y="30" font-size="15" fill="#B45309" font-weight="600">
    Clear space = 4x di seluruh sisi
  </text>

  <!-- ============ Logomark: 8x lebar × 10x tinggi ============ -->
  <rect x="180" y="120" width="160" height="200" fill="none"
        stroke="#2563EB" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Pin lokasi (skematik) -->
  <path d="M260 120
           C 304 120 340 156 340 200
           C 340 256 260 320 260 320
           C 260 320 180 256 180 200
           C 180 156 216 120 260 120 Z"
        fill="none" stroke="#168A4A" stroke-width="4"/>

  <!-- Kaca pembesar di dalam pin -->
  <circle cx="248" cy="194" r="40" fill="none" stroke="#168A4A" stroke-width="4"/>
  <line x1="277" y1="223" x2="306" y2="252" stroke="#168A4A" stroke-width="4" stroke-linecap="round"/>

  <!-- Sumbu simetri -->
  <line x1="260" y1="100" x2="260" y2="340" stroke="#DC2626" stroke-width="0.75" stroke-dasharray="4 4"/>

  <!-- Ukuran tinggi 10x -->
  <line x1="150" y1="120" x2="150" y2="320" stroke="#2563EB" stroke-width="1.25"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="108" y="226" font-size="17" fill="#2563EB" font-weight="700">10x</text>

  <!-- Ukuran lebar 8x -->
  <line x1="180" y1="350" x2="340" y2="350" stroke="#2563EB" stroke-width="1.25"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="243" y="374" font-size="17" fill="#2563EB" font-weight="700">8x</text>

  <!-- ============ Jarak logomark → wordmark = 3x ============ -->
  <line x1="340" y1="220" x2="400" y2="220" stroke="#2563EB" stroke-width="1.25"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="353" y="209" font-size="17" fill="#2563EB" font-weight="700">3x</text>

  <!-- ============ Wordmark: tinggi 6x (baseline → puncak huruf besar) ============ -->
  <rect x="400" y="160" width="700" height="120" fill="none"
        stroke="#2563EB" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- textLength memaksa lebar tetap, agar diagram konsisten di font apa pun -->
  <text x="400" y="280" font-size="132" font-weight="700" fill="#168A4A"
        textLength="700" lengthAdjust="spacingAndGlyphs">Seekitar</text>

  <!-- Baseline -->
  <line x1="380" y1="280" x2="1120" y2="280" stroke="#9CA3AF"
        stroke-width="1" stroke-dasharray="3 3"/>
  <text x="1096" y="298" font-size="12" fill="#6B7280">baseline</text>

  <!-- Penanda huruf "e" kedua -->
  <circle cx="620" cy="238" r="46" fill="none" stroke="#DC2626"
          stroke-width="1.75" stroke-dasharray="5 3"/>
  <line x1="620" y1="284" x2="620" y2="336" stroke="#DC2626" stroke-width="1"/>
  <text x="452" y="356" font-size="15" fill="#DC2626">
    huruf “e” kedua: potongan melingkar menyerupai kaca pembesar
  </text>

  <!-- Ukuran tinggi wordmark 6x -->
  <line x1="1130" y1="160" x2="1130" y2="280" stroke="#2563EB" stroke-width="1.25"
        marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="1142" y="226" font-size="17" fill="#2563EB" font-weight="700">6x</text>

  <!-- Keterangan -->
  <text x="100" y="432" font-size="14" fill="#4B5563">
    Satuan <tspan font-weight="700">x = 1/10 tinggi logomark</tspan> · 1 kotak grid = 1x
  </text>
  <text x="100" y="454" font-size="13" fill="#9CA3AF">
    Diagram spesifikasi ukuran — bukan artwork logo final. Bentuk pin &amp; lensa digambar skematis.
  </text>
</svg>
