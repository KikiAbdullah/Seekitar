name: seekitar_mobile
description: "Seekitar — Pasar Lokal Satu Kabupaten"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  connectivity_plus: ^6.1.0
  provider: ^6.1.0
  go_router: ^14.8.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.4.0
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  smooth_page_indicator: ^1.2.0
  flutter_svg: ^2.0.0
  image_picker: ^1.1.0
  flutter_image_compress: ^2.5.1
  geolocator: ^13.0.0
  geocoding: ^3.0.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^18.0.0
  share_plus: ^13.3.0
  url_launcher: ^6.3.0
  intl: ^0.19.0
  logger: ^2.5.0
  package_info_plus: ^10.2.1
  flutter_osm_plugin: 1.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/logo_lockup.png
    - assets/images/logo_lockup_putih.png
    - assets/images/hero.jpg
    - assets/images/og.jpg

flutter_native_splash:
  color: "#168A4A"
  image: assets/images/logo_lockup_putih.png
  android: true
  ios: true
  android_12:
    color: "#168A4A"
    image: assets/images/logo_lockup_putih.png
