# Konfigurasi analyzer untuk Seekitar Mobile.
# Jalankan: flutter analyze  &&  dart run custom_lint
#
# Aturan di sini menegakkan pola yang dijelaskan di
# Mobile_Implementation_Guide.md §17.3.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # json_serializable menaruh @JsonKey pada parameter konstruktor;
    # analyzer menandainya keliru sebagai target anotasi tidak valid.
    invalid_annotation_target: ignore

    # BuildContext setelah await tanpa cek `mounted` = penyebab crash paling
    # umum di aplikasi ini. Naikkan dari warning menjadi error.
    use_build_context_synchronously: error

    # Future yang lupa di-await menyebabkan bug senyap (token belum tersimpan
    # saat request berikutnya berjalan).
    unawaited_futures: error

  exclude:
    # Berkas hasil generate — bukan kode yang kita tulis.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated_plugin_registrant.dart"

linter:
  rules:
    # --- Konsistensi impor -------------------------------------------------
    - always_use_package_imports      # cegah campur relatif & package

    # --- Performa ----------------------------------------------------------
    - prefer_const_constructors       # kurangi rebuild yang tidak perlu
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - sized_box_for_whitespace

    # --- Keamanan & kebenaran ----------------------------------------------
    - avoid_print                     # pakai logger, jangan print
    - avoid_empty_else
    - cancel_subscriptions            # StreamSubscription wajib dibatalkan
    - close_sinks
    - unawaited_futures
    - use_build_context_synchronously

    # --- Keterbacaan -------------------------------------------------------
    - always_declare_return_types
    - prefer_final_locals
    - require_trailing_commas         # diff lebih bersih
    - sort_child_properties_last      # `child` di akhir agar mudah dibaca
